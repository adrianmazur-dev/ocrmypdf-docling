[project]
name = "ocrmypdf-docling"
description = "OCRmyPDF plugin for Docling Serve"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Adrian Mazur" }]
version = "1.0.0"
requires-python = ">=3.14"
classifiers = [
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
dependencies = [
    "httpx>=0.28",
    "langcodes>=3.5",
    "ocrmypdf>=17.14.2",
    "pillow>=13",
    "pydantic>=2.14",
]

[dependency-groups]
dev = [
    "ruff>=0.17.5",
    "ty>=0.0.105",
]

[project.urls]
Homepage = "https://github.com/adrianmazur-dev/ocrmypdf-docling"
Repository = "https://github.com/adrianmazur-dev/ocrmypdf-docling.git"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"
